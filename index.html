<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoassets • Generate quickly 3D models from a simple textual or visual description</title>

    <link rel="icon" href="assets/img/icon.svg">

    <meta name="google-site-verification" content="n5yJLSJB-XuNZS0Agbs5fyaK5gcqXLpBukled2hyIko" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://ajax.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: blob:; worker-src blob:;">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/lucide.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/es-module-shims@2.8.2/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "@gradio/client": "https://cdn.jsdelivr.net/npm/@gradio/client@2.3.1/+esm",
                "@huggingface/hub": "https://cdn.jsdelivr.net/npm/@huggingface/hub@2.13.3/+esm"
            }
        }
    </script>
</head>
<body>

    <div class="top-actions">
        <button type="button" id="cancel-button" class="secondary-button" hidden>Cancel</button>
        <div class="properties-container">
            <button type="button" id="download-button">
                <span>Download (0.00 MB)</span>
                <span class="icon icon-download"></span>
            </button>
        </div>
    </div>

    <div class="viewer-container">
        <div class="viewer-preview"></div>
        <model-viewer class="viewer-content" alt="" src="" shadow-intensity="1" tone-mapping="neutral" camera-controls touch-action="pan-y" interaction-prompt="none" auto-rotate camera-orbit="9.698deg 72.69deg 8m" max-camera-orbit="0 0 8m" min-camera-orbit="0 0 5m"></model-viewer>
    </div>

    <div class="loader-container active static">
        <div class="loader-cube">
            <div class="cube">
                <div class="cube-face-a"></div>
                <div class="cube-face-b"></div>
                <div class="cube-face-c"></div>
                <div class="cube-face-d"></div>
                <div class="cube-face-e"></div>
                <div class="cube-face-f"></div>
            </div>
        </div>
        <span class="loader-label" aria-live="polite">Write down a prompt to begin</span>
    </div>

    <div class="form-container">
        <div class="form-type-container" role="tablist" aria-label="Input type">
            <button type="button" class="type-item active" id="type-text" role="tab" aria-selected="true">Text<span class="icon-text-cursor-input"></span></button>
            <button type="button" class="type-item" id="type-image" role="tab" aria-selected="false">Image<span class="icon-image"></span></button>
        </div>
        <div class="form-event-container" aria-live="polite">
            <div class="form-event-wrapper"></div>
        </div>
        <form id="form-data">
            <div class="main-form">
                <div class="main-form-group">
                    <input class="form-input form-type-text" type="text" id="prompt-text" name="prompt" placeholder="Describe the 3D model you want to generate" required>
                    <button type="button" class="form-input secondary form-type-text" id="preset-button" aria-label="Random preset"><span class="icon-shuffle"></span></button>
                    <input accept="image/png, image/jpeg" class="form-input form-type-image type-disabled" type="file" id="prompt_image" name="prompt_image">
                    <label tabindex="0" class="form-input form-type-image type-disabled" for="prompt_image">
                        <span class="input-file-label">Import or drag-and-drop an image<span class="icon-upload"></span></span>
                        <span class="input-file-label active">Remove image<span class="icon-x"></span></span>
                        <div class="input-preview-image"></div>
                    </label>
                </div>
                <button type="submit" id="generate-button" disabled>
                    <span>Checking services…</span>
                    <span class="icon icon-sparkles"></span>
                </button>
            </div>
            <button type="button" class="form-settings-label" aria-expanded="false" aria-controls="form-settings">
                <span>Advanced</span>
                <div class="icon">
                    <span class="icon-chevron-down"></span>
                </div>
            </button>
            <div class="form-settings-container" id="form-settings">
                <span class="banner-wrapper --warning"><span class="icon icon-triangle-alert"></span>Some parameters may not be available on all models</span>
                <div class="form-side">
                    <div class="form-group">
                        <label for="image_sampler">Image Sampler</label>
                        <select id="image_sampler" name="image_sampler" required></select>
                    </div>
                    <div class="form-group">
                        <label for="mesh_builder">Mesh Builder</label>
                        <select id="mesh_builder" name="mesh_builder" required></select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="additional_prompt">Additional Prompt</label>
                    <input type="text" id="additional_prompt" name="additional_prompt" placeholder="Additional prompt to enhance generation" value="(3D model), (overall view), (white background), studio photo, blender, 3D render, large view, (single object)">
                </div>
                <div class="form-group">
                    <label for="negative_prompt">Negative Prompt</label>
                    <input type="text" id="negative_prompt" name="negative_prompt" placeholder="Describe what you don't want the model to generate" value="longbody, lowres, bad anatomy, bad hands, missing fingers, extra digit, fewer digits, cropped, worst quality, low quality">
                </div>
                <div class="form-group">
                    <label for="sample_steps">Sample Steps</label>
                    <input type="number" id="sample_steps" name="sample_steps" value="75" min="30" max="75">
                </div>
                <div class="form-side">
                    <div class="form-group">
                        <label for="use_random_seed" class="checkbox">Use Random Seed</label>
                        <input type="checkbox" id="use_random_seed" name="use_random_seed" checked>
                    </div>
                    <div class="form-group">
                        <label for="seed">Seed</label>
                        <input type="number" id="seed" name="seed" value="0" min="0" max="1000000" disabled>
                    </div>
                </div>
                <div class="form-side">
                    <div class="form-group">
                        <label for="width">Width</label>
                        <input type="number" id="width" name="width" value="1024" min="256" max="1024">
                    </div>
                    <div class="form-group">
                        <label for="height">Height</label>
                        <input type="number" id="height" name="height" value="1024" min="256" max="1024">
                    </div>
                </div>
                <div class="form-side">
                    <div class="form-group">
                        <label for="guidance_scale_base">Guidance Scale</label>
                        <input type="number" id="guidance_scale_base" name="guidance_scale_base" value="5" min="1" max="20">
                    </div>
                    <div class="form-group">
                        <label for="num_inference_steps_base">Number of Inference Steps</label>
                        <input type="number" id="num_inference_steps_base" name="num_inference_steps_base" value="25" min="10" max="100">
                    </div>
                </div>
                <div class="form-side">
                    <div class="form-group">
                        <label for="apply_refiner" class="checkbox">Enable Refiner</label>
                        <input type="checkbox" id="apply_refiner" name="apply_refiner">
                    </div>
                    <div class="form-group">
                        <label for="guidance_scale_refiner">Guidance Scale (Refiner)</label>
                        <input type="number" id="guidance_scale_refiner" name="guidance_scale_refiner" value="5" min="1" max="20" disabled>
                    </div>
                    <div class="form-group">
                        <label for="num_inference_steps_refiner">Number of Inference Steps (Refiner)</label>
                        <input type="number" id="num_inference_steps_refiner" name="num_inference_steps_refiner" value="25" min="10" max="100" disabled>
                    </div>
                </div>
                <div class="form-group">
                    <label for="hf_api_key">Hugging Face Access Token<span data-tooltip="Add your Access Token with write permission to get more GPU requests."><span class="icon icon-circle-help"></span></span></label>
                    <input type="password" id="hf_api_key" name="hf_api_key" placeholder="hf..." autocomplete="off">
                </div>
            </div>
        </form>
        <div class="footer-container">
            <span>By using Autoassets, you agree <a href="legal.html">Terms of Service</a></span>
            <a href="https://github.com/gsbm/autoassets" target="_blank" rel="noopener noreferrer"><span class="icon icon-github"></span> GitHub</a>
        </div>
    </div>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
